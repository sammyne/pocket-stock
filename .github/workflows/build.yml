name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Verify dependencies
        run: |
          uv pip list

  lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff linting
        run: |
          uv run ruff check --output-format=github

  format-check:
    name: Ruff Format Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run ruff format check
        run: |
          uv run ruff format --check --diff

  type-check:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run mypy type check
        run: |
          uv run mypy --show-error-codes --pretty --package pocket_stock

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, format-check, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v -m "not integration" --tb=short

  integration-tests:
    name: Integration Tests and Coverage
    runs-on: ubuntu-latest
    needs: [lint, format-check, type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.2"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run all tests with coverage
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
